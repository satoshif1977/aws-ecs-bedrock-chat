name: Python Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ruff / black / pytest
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest ruff black boto3 pytest-cov

      - name: ruff（構文チェック）
        run: ruff check app/ scripts/ modules/

      - name: black（フォーマットチェック）
        run: black --check app/ scripts/ modules/

      - name: pytest
        run: pytest app/test_app.py scripts/test_health_check.py -v --tb=short --cov=app --cov=scripts --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python
          fail_ci_if_error: false
